<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Vendas — Will Tour</title>
<link rel="stylesheet" href="style.css">
<style>
  .hub{ grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .hub-card{ padding: 18px 14px; }
  .get-line{ font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--surface-2);
    border: 1px solid var(--hair); border-radius: 10px; padding: 10px 14px; margin: 0 0 14px;
    display:flex; gap:16px; align-items:center; }
  .get-line .url{ flex:1; overflow-x:auto; white-space:nowrap; }
  .get-line b{ color: var(--accent); margin-right: 8px; }
  .get-line .st{ order: 2; white-space: nowrap; color: var(--ink-muted); }
  .get-line .st.ok{ color: var(--good); } .get-line .st.err{ color: var(--crit); }
  .api-form{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; margin-bottom:14px; }
  .api-form .filter-field input{ font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--hair); background: var(--surface); color: var(--ink); width: 140px; }
  .api-form button{ font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1.5px solid var(--accent); background: var(--accent); color: #fff; }
  .api-form button.sec{ background: transparent; color: var(--accent); }
  .meta-line{ font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
  .tbl-wrap{ overflow-x: auto; border: 1px solid var(--hair); border-radius: 10px; }
  table.api{ border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.api th{ position: sticky; top: 0; background: var(--surface-2); text-align: left; padding: 8px 10px;
    font-weight: 600; color: var(--ink-2); white-space: nowrap; border-bottom: 1px solid var(--hair); }
  table.api td{ padding: 7px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; max-width: 320px; }
  table.api tr.click{ cursor: pointer; } table.api tr.click:hover td{ background: var(--accent-soft); }
  table.api tr.sel td{ background: var(--accent-soft); }
  table.api td .obj{ font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--ink-2); white-space: pre-wrap; }
  details.raw{ margin-top: 12px; } details.raw summary{ cursor: pointer; font-size: 13px; color: var(--ink-2); }
  details.raw pre{ max-height: 420px; overflow: auto; font-size: 12px; background: var(--surface-2);
    padding: 12px; border-radius: 10px; }
  .sub-panel{ margin-top: 24px; }
  .sub-panel h3{ font-family: Fraunces, serif; margin: 18px 0 8px; font-size: 17px; }
  .hint{ font-size: 13px; color: var(--ink-muted); margin: 8px 0 0; }
  .paginacao{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:flex-end;
    margin-top:12px; font-size:13px; color: var(--ink-2); }
  .paginacao select{ font: inherit; margin-left:6px; padding:6px 8px; border-radius:8px;
    border:1px solid var(--hair); background: var(--surface); color: var(--ink); }
  .paginacao button{ font: inherit; font-weight:600; padding:6px 14px; border-radius:8px; cursor:pointer;
    border:1.5px solid var(--accent); background:transparent; color: var(--accent); }
  .paginacao button:disabled{ opacity:.35; cursor:default; }
  .paginacao .pg-info{ margin-right:auto; }
  .persona-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:16px; margin-top:16px; }
  .persona-grid h3{ margin-top:0; }
  .persona-resumo{ font-size:15px; }
  table.api td.nome{ min-width: 200px; }
  .persona-topo{ display:grid; grid-template-columns: 2fr 1fr; gap:16px; align-items:start; }
  @media (max-width: 880px){ .persona-topo{ grid-template-columns: 1fr; } }
  .aniv-card{ position:relative; max-height: 460px; overflow:auto; }
  .aniv-card h3{ margin-top:0; }
  .aniv-mes{ float:right; font-size:13px; color: var(--ink-2); }
  .aniv-mes select{ font: inherit; margin-left:6px; padding:4px 6px; border-radius:8px;
    border:1px solid var(--hair); background: var(--surface); color: var(--ink); }
  .aniv{ display:grid; grid-template-columns: 52px 1fr auto; gap:10px; font-size:13px; padding:7px 0;
    border-bottom:1px solid var(--hair); }
  .aniv-dia{ font-weight:700; color: var(--accent); } .aniv-idade{ color: var(--ink-2); }
  .aniv.passou{ opacity:.5; } .aniv.hoje{ background: var(--accent-soft); }
  .filter-field select{ min-width: 120px; }
  .chart-wrap svg{ width:100%; height:auto; }
  .bar-group{ cursor:pointer; }
  td.acc-col{ width: 28px; padding-right: 0; }
  td.acc-col .acc-btn{ font-size: 18px; line-height: 1; padding: 2px 6px; font-weight: 700; }
  table.api .num{ text-align:right; }
  td.prod{ min-width: 200px; }
  .acc-btn{ font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; background: none; border: 0;
    color: var(--accent); padding: 0; }
  .acc-btn small{ color: var(--ink-muted); }
  .acc-seta{ display:inline-block; transition: transform .15s; }
  .acc-btn.aberto .acc-seta{ transform: rotate(90deg); }
  tr.acc-linha > td{ background: var(--surface-2); padding: 14px 16px; max-width: none; }
  .acc-conteudo{ position: sticky; left: 0; padding-left: 4px; width: min(1050px, calc(100vw - 110px)); }
  .prod-bloco + .prod-bloco{ margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hair); }
  .prod-bloco h4{ margin: 0 0 10px; font-size: 14px; }
  .prod-campos{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 18px; }
  .prod-campo.largo{ grid-column: 1 / -1; }
  table.voos{ border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  table.voos th{ text-align:left; font-size:11px; color: var(--ink-muted); font-weight:600; padding: 3px 14px 3px 0; text-transform:none; letter-spacing:0; }
  table.voos td{ padding: 3px 14px 3px 0; border-top: 1px solid var(--hair); white-space: nowrap; }
  .prod-campo span{ display:block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); }
  .prod-campo div{ font-size: 13px; word-break: break-word; }
  .resumos{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 880px){ .resumos{ grid-template-columns: 1fr; } }
  .resumos h3{ margin-top:0; }
  .resumos > .card{ min-width:0; }
  table.resumo td:not(:first-child), table.resumo th:not(:first-child){ text-align:right; }
  table.resumo tfoot td{ font-weight:700; border-top:1.5px solid var(--baseline); }
  .hbars{ margin-top: 12px; }
  .hbar{ display:grid; grid-template-columns: 150px 1fr 110px; gap:12px; align-items:center; margin: 10px 0; font-size:13px; }
  .hbar-nome{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar-trilho{ height:18px; background: var(--surface-2); border-radius:5px; overflow:hidden; }
  .hbar-barra{ display:block; height:100%; border-radius:5px; }
  .hbar-valor{ text-align:right; font-weight:600; line-height:1.2; }
  .hbar-valor small{ display:block; font-weight:400; font-size:11px; color: var(--ink-muted); }
  .kpis{ grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)) !important; }
  .kpi.azul .value{ color: var(--accent); } .kpi.azul{ box-shadow: inset 0 3px 0 var(--accent); }
  .kpi.vermelho .value{ color: var(--crit); } .kpi.vermelho{ box-shadow: inset 0 3px 0 var(--crit); }
  .despesas{ margin-top:16px; }
  .desp{ padding: 14px 20px; }
  .desp summary{ cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .desp summary::-webkit-details-marker{ display:none; }
  .desp summary::before{ content:'▸'; color: var(--accent); margin-right:8px; transition: transform .15s; }
  .desp[open] summary::before{ transform: rotate(90deg); }
  .desp[open] summary{ margin-bottom:12px; }
  .desp-titulo{ font-family: Fraunces, serif; font-size:16px; font-weight:600; flex:1; }
  .desp-info{ font-size:13px; color: var(--ink-2); } .desp-info b{ color: var(--crit); }
  .desp-tbl .num{ text-align:right; }
  .kpi-desp summary{ cursor:pointer; list-style:none; font-size:12px; color: var(--accent); margin-top:6px; }
  .kpi-desp summary::-webkit-details-marker{ display:none; }
  .kpi-desp summary::before{ content:'▸'; display:inline-block; margin-right:5px; transition: transform .15s; }
  .kpi-desp[open] summary::before{ transform: rotate(90deg); }
  .kpi-conta{ list-style:none; margin:8px 0 0; padding:0; text-align:left; font-size:11.5px; }
  .kpi-conta li{ display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
  .kpi-conta li.total{ border-top:1px solid var(--hair); margin-top:3px; padding-top:4px; font-weight:700; }
  .pbar{ display:grid; grid-template-columns: 120px 1fr 80px; gap:10px; align-items:center; font-size:13px; margin:8px 0; }
  .pbar-k{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pbar-track{ height:10px; background: var(--surface-2); border-radius:6px; overflow:hidden; }
  .pbar-fill{ display:block; height:100%; background: var(--accent); border-radius:6px; }
  .pbar-n{ text-align:right; } .pbar-n small{ color: var(--ink-muted); }
</style>
<script>
  // Ao recarregar, sempre comeca no topo (nao volta para onde estava rolado).
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
</script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <p class="brand-eyebrow">Will Tour SRS &middot; Viagens e Turismo</p>
      <h1>Painel Will Tour</h1>
    </div>
    <div class="top-meta">
      Fonte: <b>API Pax Pro</b><br>
      <span id="api-base"></span>
    </div>
  </header>

  <section class="hub" id="hub"></section>

  <section class="card" id="painel"></section>

</div>

<script type="module">
  // Sempre carrega a versao mais nova dos scripts (evita cache do navegador
  // depois de cada ajuste). O explorer.js repassa o ?v= para os outros modulos.
  import(`./explorer.js?v=${Date.now()}`);
</script>
</body>
</html>
